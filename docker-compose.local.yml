version: "3.9"

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: inventory_db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory_net

  # ──────────────────────────────────────────────────────────────
  # Django Backend (Dev mode with runserver auto-reloading & volume mount)
  # ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python docker-setup.py &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventory_net

  # ──────────────────────────────────────────────────────────────
  # React Frontend (Vite Dev Server with HMR & volume mount)
  # ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: inventory_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
    networks:
      - inventory_net

# ──────────────────────────────────────────────────────────────
# Persistent volumes
# ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  media_data:

networks:
  inventory_net:
    driver: bridge
